name: Clone External Sports Repositories

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/upstreams.lock.json'
      - 'scripts/clone_external_sports_repos.sh'
      - 'scripts/validate_upstreams_lock.py'
      - '.github/workflows/clone-external-sports-repos.yml'
  push:
    branches:
      - main
    paths:
      - 'integrations/upstreams.lock.json'
      - 'scripts/clone_external_sports_repos.sh'
      - 'scripts/validate_upstreams_lock.py'
      - '.github/workflows/clone-external-sports-repos.yml'

permissions:
  contents: read

jobs:
  clone-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PhilthyParleys
        uses: actions/checkout@v4

      - name: Validate pinned upstream manifest
        run: python3 scripts/validate_upstreams_lock.py

      - name: Clone pinned upstream repositories 3-27
        run: bash scripts/clone_external_sports_repos.sh

      - name: Record cloned source inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PhilthyParleys external source bundle"
            echo "Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Source indexes: 3-27"
            echo
            cat integrations/upstreams.lock.json
            echo
            echo "Source file counts:"
            for d in integrations/vendor/*; do
              printf '%s: ' "$(basename "$d")"
              find "$d" -type f | wc -l
            done
          } > integrations/vendor/CLONE_EVIDENCE.txt

      - name: Verify clone cardinality
        shell: bash
        run: |
          set -euo pipefail
          test "$(find integrations/vendor -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "25"

      - name: Scan cloned trees for obvious secret files
        shell: bash
        run: |
          set -euo pipefail
          if find integrations/vendor -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -print | grep -q .; then
            echo "Potential secret-bearing files found in upstream trees; refusing to package." >&2
            find integrations/vendor -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -print
            exit 1
          fi

      - name: Package verified clones
        uses: actions/upload-artifact@v4
        with:
          name: PhilthyParleys-external-sports-repos-3-27
          path: integrations/vendor
          if-no-files-found: error
          retention-days: 14
