name: Publish Backend Image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish canonical backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/philthyparleys-backend:latest
            ghcr.io/${{ github.repository_owner }}/philthyparleys-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image reference
        run: |
          printf '%s\n' "ghcr.io/${GITHUB_REPOSITORY_OWNER}/philthyparleys-backend:${GITHUB_SHA}" > backend-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: philthyparleys-backend-image-reference
          path: backend-image.txt
          retention-days: 90
