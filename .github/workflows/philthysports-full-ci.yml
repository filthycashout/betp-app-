name: PhilthyParleys Release Candidate CI

on:
  workflow_dispatch:
    inputs:
      runtime_root:
        description: 'Public HTTPS runtime root used by the APK (no trailing slash)'
        required: true
        default: 'https://philthyparleys.floot.app'
        type: string
      runtime_api_prefix:
        description: 'Provider API prefix. Use /_api for Floot; leave empty for canonical FastAPI hosts.'
        required: false
        default: '/_api'
        type: string
      signing_base:
        description: 'Temporary HTTPS signing-material bridge'
        required: true
        default: 'https://philthysports-api-v9.onrender.com'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: philthyparleys-release-candidate
  cancel-in-progress: true

env:
  PHILTHY_RUNTIME_ROOT: ${{ inputs.runtime_root }}
  PHILTHY_RUNTIME_API_PREFIX: ${{ inputs.runtime_api_prefix }}
  PHILTHY_SIGNING_BASE: ${{ inputs.signing_base }}

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.parse
          for name in ('PHILTHY_RUNTIME_ROOT','PHILTHY_SIGNING_BASE'):
              value=os.environ[name].strip().rstrip('/')
              parsed=urllib.parse.urlparse(value)
              if parsed.scheme!='https' or not parsed.netloc or parsed.username or parsed.password:
                  raise SystemExit(f'{name} must be a credential-free HTTPS root')
          prefix=os.environ.get('PHILTHY_RUNTIME_API_PREFIX','')
          if prefix and (not prefix.startswith('/') or prefix.endswith('/')):
              raise SystemExit('PHILTHY_RUNTIME_API_PREFIX must be empty or a slash-prefixed path without trailing slash')
          PY
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-validation.txt
      - name: Backend regression suite
        run: |
          python -m py_compile \
            backend/app.py \
            backend/selftest.py \
            backend/evidence/runtime.py \
            backend/odds_api_net.py \
            ci/portable_backend_contract.py \
            ci/governed_release_gate.py
          PYTHONPATH=backend pytest -q backend/tests
      - name: Require complete deployed production contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          API_BASE="${PHILTHY_RUNTIME_ROOT%/}${PHILTHY_RUNTIME_API_PREFIX}"
          python ci/portable_backend_contract.py \
            --base "$API_BASE" \
            --report release-evidence/production-contract.json
          printf '%s\n' "$API_BASE" > release-evidence/runtime-api-base.txt
      - name: Require governed NFL and NBA model promotion
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="${PHILTHY_RUNTIME_ROOT%/}${PHILTHY_RUNTIME_API_PREFIX}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 \
            "$API_BASE/v1/models/status" \
            -o release-evidence/model-status-envelope.json
          python ci/governed_release_gate.py \
            --model-status release-evidence/model-status-envelope.json \
            --output release-evidence/readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhilthyParleys-production-readiness
          path: release-evidence/
          retention-days: 90

  android:
    runs-on: ubuntu-latest
    needs: production-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: |
          flutter create --platforms=android --org com.philthysports --project-name philthysports .
          rm -f test/widget_test.dart
          python ci/apply_android_branding.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="philthysports"','android:label="PhilthyParleys"')
          permission='<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    '+permission)
          p.write_text(s)
          PY
      - name: Fetch pinned release signing material from signing bridge
        shell: bash
        run: |
          set -euo pipefail
          AUDIENCE='philthysports-ci'
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          SIGNING_JSON="$(curl -fsS --retry 4 --retry-all-errors --retry-delay 2 -H "Authorization: Bearer $OIDC_TOKEN" "$PHILTHY_SIGNING_BASE/v1/ci/android-signing-material")"
          SIGNING_PATH="$RUNNER_TEMP/philthysports-signing.json"
          umask 077
          printf '%s' "$SIGNING_JSON" > "$SIGNING_PATH"
          python - "$SIGNING_PATH" <<'PY'
          import base64,json,pathlib,sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected='0b1a418efeef35fdbbb77dfc129aabae2fc43141e3893dc21fd03cac8fa9f469'
          if payload.get('public_spki_sha256') != expected:
              raise SystemExit('Signing key does not match pinned release certificate')
          pathlib.Path('android-release-key.pk8').write_bytes(base64.b64decode(payload['private_key_pkcs8_b64'],validate=True))
          PY
          rm -f "$SIGNING_PATH"
          TEMP_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$TEMP_PASS"
          echo "PHILTHY_TEMP_STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
          openssl pkey -inform DER -in android-release-key.pk8 -out android-release-key.pem
          openssl pkcs12 -export -inkey android-release-key.pem -in ci/android_release_cert.pem -out android/app/philthysports-release.p12 -name philthysports-release -passout "pass:$TEMP_PASS"
          rm -f android-release-key.pk8 android-release-key.pem
      - name: Configure release signing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          kts=Path('android/app/build.gradle.kts'); groovy=Path('android/app/build.gradle')
          if kts.exists():
              s=kts.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
              block='''    signingConfigs {\n        create("release") {\n            storeFile = file("philthysports-release.p12")\n            storePassword = System.getenv("PHILTHY_TEMP_STORE_PASSWORD")\n            keyAlias = "philthysports-release"\n            keyPassword = System.getenv("PHILTHY_TEMP_STORE_PASSWORD")\n            storeType = "PKCS12"\n        }\n    }\n\n'''
              if 'create("release")' not in s: s=s.replace('    buildTypes {',block+'    buildTypes {')
              s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
              kts.write_text(s)
          elif groovy.exists():
              s=groovy.read_text()
              block='''    signingConfigs {\n        release {\n            storeFile file("philthysports-release.p12")\n            storePassword System.getenv("PHILTHY_TEMP_STORE_PASSWORD")\n            keyAlias "philthysports-release"\n            keyPassword System.getenv("PHILTHY_TEMP_STORE_PASSWORD")\n            storeType "PKCS12"\n        }\n    }\n\n'''
              if 'signingConfigs {' not in s: s=s.replace('    buildTypes {',block+'    buildTypes {')
              s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.release')
              groovy.write_text(s)
          else: raise SystemExit('No Android app Gradle file found')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile_dashboard/package-lock.json
      - name: Build dashboard and signed APK against selected runtime
        run: |
          cd mobile_dashboard
          npm ci --no-audit --no-fund
          npm test
          npm run build
          cd ..
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --dart-define=PHILTHY_API_BASE_URL=$PHILTHY_RUNTIME_ROOT
      - name: Verify signature and stage candidate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee apk-signature.txt
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' apk-signature.txt | awk -F': ' '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = '97BE4C2028288638C8BE55CE7540164A1995A1F18675964E3D8E733744D89700'
          cp build/app/outputs/flutter-apk/app-release.apk PhilthyParleys.apk
          sha256sum PhilthyParleys.apk > PhilthyParleys.apk.sha256
      - name: Audit signed APK domains
        run: python ci/apk_domain_audit.py --apk PhilthyParleys.apk --report apk-domain-audit.json --fail-on-ag --fail-on-corpus-match
      - uses: actions/upload-artifact@v4
        with:
          name: PhilthyParleys-candidate
          path: |
            PhilthyParleys.apk
            PhilthyParleys.apk.sha256
            apk-signature.txt
            apk-domain-audit.json

  emulator:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhilthyParleys-candidate
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch exact signed APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python ci/device_smoke.py --apk PhilthyParleys.apk --output device-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhilthyParleys-emulator-evidence
          path: device-report/
          retention-days: 90

  release-ready:
    runs-on: ubuntu-latest
    needs: [production-readiness, android, emulator]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhilthyParleys-candidate
      - uses: actions/download-artifact@v4
        with:
          name: PhilthyParleys-emulator-evidence
          path: emulator-evidence
      - name: Mark exact artifact release-ready only after every gate passed
        run: |
          test -f PhilthyParleys.apk
          test -f PhilthyParleys.apk.sha256
          test -d emulator-evidence
          printf '%s\n' 'Portable production contract, governed NFL/NBA model promotion, stable signing, and emulator gates passed.' > RELEASE_READY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PhilthyParleys-release-ready
          path: |
            PhilthyParleys.apk
            PhilthyParleys.apk.sha256
            apk-signature.txt
            apk-domain-audit.json
            RELEASE_READY.txt
          retention-days: 90
