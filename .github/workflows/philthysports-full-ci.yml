name: PhilthySports Full CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: philthysports-full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Reject tracked secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|Keys[^/]*\.txt|credentials\.json)$'; then
            echo "Tracked secret-bearing file detected."
            exit 1
          fi
          if grep -RIl --exclude-dir=.git --exclude='*.md' -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .; then
            echo "Private-key material detected in source."
            exit 1
          fi

      - name: Python syntax
        run: python -m py_compile backend/app.py backend/selftest.py

      - name: Backend governance selftest
        working-directory: backend
        run: python selftest.py

  android:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.philthysports --project-name philthysports .
          rm -f test/widget_test.dart
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
              )
              p.write_text(s)
          PY

      - name: Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build release APK against Powerhouse
        run: >-
          flutter build apk --release
          --dart-define=PHILTHY_API_BASE_URL=https://philthysports-powerhouse-v8.onrender.com

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Create SHA-256
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk | tee PhilthySports-1.4.0.apk.sha256

      - name: Stage APK
        run: cp build/app/outputs/flutter-apk/app-release.apk PhilthySports-1.4.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhilthySports-1.4.0-android
          path: |
            PhilthySports-1.4.0.apk
            PhilthySports-1.4.0.apk.sha256
