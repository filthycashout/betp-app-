name: PhilthySports v8 Historical Backfill

on:
  push:
    branches: [main]
    paths:
      - "backend/training/historical_backfill.py"
      - "backend/training/historical_resolution_recover.py"
      - "backend/training/odds_api_historical_backfill.py"
      - ".github/workflows/v8-historical-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philthysports-v8-historical-backfill
  cancel-in-progress: false

jobs:
  audit-historical-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current training source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out durable evidence history
        uses: actions/checkout@v4
        with:
          ref: evidence-snapshots
          path: evidence_checkout
          fetch-depth: 0

      - name: Refresh evidence branch before mutation
        run: git -C evidence_checkout pull --ff-only origin evidence-snapshots

      - name: Download pinned timestamped historical source
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/ADnocap/taut-arb-backtest/releases/download/v3.0-sports/sports_data.db.gz"
          EXPECTED="67c1db827dc310e8bed13783e4139164784dedf40abb4faf2eeb8ebd212a6ee0"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o /tmp/sports_data.db.gz "$URL"
          echo "$EXPECTED  /tmp/sports_data.db.gz" | sha256sum -c -
          gzip -dc /tmp/sports_data.db.gz > /tmp/sports_data.db
          test -s /tmp/sports_data.db

      - name: Extract source into quarantine only
        shell: bash
        run: |
          set -euo pipefail
          TARGET="evidence_checkout/evidence/historical/quarantine/taut-arb-v3"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          python backend/training/historical_backfill.py extract \
            --db /tmp/sports_data.db \
            --output-dir "$TARGET" \
            --source-url "https://github.com/ADnocap/taut-arb-backtest/releases/download/v3.0-sports/sports_data.db.gz" \
            --source-asset-sha256 "67c1db827dc310e8bed13783e4139164784dedf40abb4faf2eeb8ebd212a6ee0" \
            --source-release "v3.0-sports" \
            --min-match-score 0.90

      - name: Record why settlement-price labels are inadmissible
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence_checkout/evidence/historical/quarantine/taut-arb-v3')
          report={
            'schema_version': 2,
            'status': 'QUARANTINED_NOT_PROMOTION_ELIGIBLE',
            'source': 'ADnocap/taut-arb-backtest v3.0-sports',
            'pregame_odds_use': 'research_only_until_label_publication_evidence_is_repaired',
            'blocking_reason': (
              'The legacy label_available_at value is derived from a post-event 0.99/0.01 market-price crossing. '
              'A price crossing is not independent proof that an authoritative final result was publicly observable at that timestamp.'
            ),
            'required_repair': (
              'Join every retained event to an independently timestamped authoritative final-result publication, '
              'preserve the raw result receipt and hash, and require as_of < event_time < label_available_at.'
            ),
            'promotion_ready': False,
            'promotion_eligible': False,
            'independent_publication_timestamp_verified': False,
          }
          (root/'ADMISSIBILITY.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          for manifest in root.glob('*_source_manifest.json'):
            data=json.loads(manifest.read_text())
            data['promotion_ready']=False
            data['promotion_eligible']=False
            data['independent_publication_timestamp_verified']=False
            data['label_timestamp_role']='research_only_market_resolution_proxy'
            manifest.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Verify quarantined source cannot enter canonical history
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence_checkout/evidence/historical/quarantine/taut-arb-v3/ADMISSIBILITY.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence_checkout/evidence/historical/quarantine/taut-arb-v3')
          manifests=list(root.glob('*_source_manifest.json'))
          if not manifests:
              raise SystemExit('no source manifests were produced')
          for path in manifests:
              m=json.loads(path.read_text())
              assert m.get('promotion_eligible') is False, path
              assert m.get('independent_publication_timestamp_verified') is False, path
          print('PASS: taut-arb price-crossing labels are quarantined and fail closed')
          PY

      - name: Commit quarantine evidence only
        shell: bash
        run: |
          set -euo pipefail
          git -C evidence_checkout config user.name "philthysports-evidence-bot"
          git -C evidence_checkout config user.email "actions@users.noreply.github.com"
          git -C evidence_checkout add evidence/historical/quarantine/taut-arb-v3
          if git -C evidence_checkout diff --cached --quiet; then
            echo "Historical quarantine audit produced no evidence changes."
            exit 0
          fi
          git -C evidence_checkout commit -m "Quarantine historical market-resolution label proxies"
          git -C evidence_checkout pull --rebase origin evidence-snapshots
          git -C evidence_checkout push origin evidence-snapshots

      - name: Confirm canonical history was not rebuilt from quarantined labels
        run: |
          echo "No historical merge is executed by this workflow."
          echo "Canonical promotion data remain unchanged until independently timestamped final-result evidence is available."
