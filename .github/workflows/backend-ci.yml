name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and test dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Compile
        run: python -m compileall -q backend
      - name: Run backend tests
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Live keyless prediction smoke
        run: PYTHONPATH=backend python backend/live_prediction_smoke.py
