name: PhilthyParleys Client & Workflow CI

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'mobile_dashboard/**'
      - 'backend/Dockerfile'
      - 'deploy/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ci/floot_cutover_smoke.py'
      - 'ci/portable_backend_contract.py'
      - '.github/workflows/floot-client-ci.yml'
      - '.github/workflows/floot-cutover-guard.yml'
      - '.github/workflows/portable-backend-ci.yml'
      - '.github/workflows/backend-ghcr.yml'
      - '.github/workflows/backend-self-host-deploy.yml'
      - '.github/workflows/philthysports-full-ci.yml'

permissions:
  contents: read

jobs:
  workflow-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration scripts and workflow YAML
        run: |
          python -m py_compile ci/floot_cutover_smoke.py ci/portable_backend_contract.py
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflows=(
              '.github/workflows/floot-client-ci.yml',
              '.github/workflows/floot-cutover-guard.yml',
              '.github/workflows/portable-backend-ci.yml',
              '.github/workflows/backend-ghcr.yml',
              '.github/workflows/backend-self-host-deploy.yml',
              '.github/workflows/philthysports-full-ci.yml',
          )
          for name in workflows:
              value=yaml.safe_load(Path(name).read_text())
              if not isinstance(value,dict) or 'jobs' not in value:
                  raise SystemExit(f'invalid workflow structure: {name}')
              print(f'validated {name}: {len(value["jobs"])} jobs')
          PY

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile_dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: mobile_dashboard
        run: npm ci --no-audit --no-fund
      - name: Test dashboard
        working-directory: mobile_dashboard
        run: npm test
      - name: Build dashboard
        working-directory: mobile_dashboard
        run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Test Flutter client
        run: flutter test
