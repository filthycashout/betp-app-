name: New API Production Probe

on:
  pull_request:
    paths:
      - ".github/workflows/ufc-production-probe.yml"
      - "backend/sports_ai/ingestion/ufc.py"
      - "backend/app.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ufc-production-probe.yml"
      - "backend/sports_ai/ingestion/ufc.py"
      - "backend/app.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe deployed UFC and Chat Picks endpoints without secrets
        shell: bash
        run: |
          set -u
          DATE="$(TZ=America/Los_Angeles date +%F)"
          for ITEM in "UFC|https://philthyparleys.floot.app/_api/v1/ufc/events?date=${DATE}" "CHAT_PICKS|https://philthyparleys.floot.app/_api/v1/chat/picks"; do
            NAME="${ITEM%%|*}"
            URL="${ITEM#*|}"
            BODY="$(mktemp)"
            if HTTP_CODE="$(curl --silent --show-error --max-time 15 --output "$BODY" --write-out "%{http_code}" "$URL")"; then
              CURL_STATUS=0
            else
              CURL_STATUS=$?
            fi
            if [ "$CURL_STATUS" -ne 0 ]; then
              echo "::warning::$NAME endpoint could not be reached from this runner (curl exit $CURL_STATUS)."
              continue
            fi
            echo "$NAME endpoint HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::$NAME endpoint is not verified as deployed/available (HTTP $HTTP_CODE)."
              continue
            fi
            python - "$NAME" "$BODY" <<'PY'
          import json, sys
          from pathlib import Path
          name, path = sys.argv[1], sys.argv[2]
          try:
              data = json.loads(Path(path).read_text())
          except Exception:
              print(f"::warning::{name} endpoint returned invalid JSON.")
              raise SystemExit(0)
          if name == "UFC":
              valid = data.get("sport") == "UFC" and isinstance(data.get("events"), list)
          else:
              valid = data.get("service") == "PhilthyParleys Chat Picks Briefing" and isinstance(data.get("sections"), dict)
          if not valid:
              print(f"::warning::{name} endpoint response does not match the expected contract.")
              raise SystemExit(0)
          print(f"{name} endpoint contract verified; status:", data.get("status"))
          if name == "UFC":
              print("Event count:", len(data["events"]))
              print("Player props supported:", data.get("player_props_supported"))
              print("Automatic wagering:", data.get("automatic_wagering"))
          else:
              print("Available sections:", sum(1 for x in data["sections"].values() if x.get("status") == "available"))
          PY
          done
