name: Floot Production Contract Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  floot-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe required Floot production contract
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python ci/floot_cutover_smoke.py
      - name: Upload Floot production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floot-production-contract-report
          path: floot-cutover-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Record production contract status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.smoke.outcome }}" = 'success' ]; then
            echo '### Floot production contract: verified' >> "$GITHUB_STEP_SUMMARY"
            echo 'The published PhilthyParleys Floot deployment satisfies the required production/mobile/dashboard contract.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Floot production contract: FAILED' >> "$GITHUB_STEP_SUMMARY"
            echo 'The required Floot production contract is broken. This workflow is blocking; promotion and release must remain blocked until the smoke report passes.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat floot-cutover-report.json || true
          fi
