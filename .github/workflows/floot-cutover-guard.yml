name: Floot Adapter Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/services/**'
      - 'mobile_dashboard/**'
      - 'ci/floot_cutover_smoke.py'
      - '.github/workflows/floot-cutover-guard.yml'
      - 'docs/FLOOT_CUTOVER_STATUS_2026-10-07.md'

permissions:
  contents: read

jobs:
  floot-adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe optional Floot adapter contract
        id: smoke
        continue-on-error: true
        run: python ci/floot_cutover_smoke.py
      - name: Upload Floot adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floot-adapter-report
          path: floot-cutover-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Record adapter status without blocking canonical backend
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.smoke.outcome }}" = 'success' ]; then
            echo '### Floot adapter: complete' >> "$GITHUB_STEP_SUMMARY"
            echo 'The optional Floot deployment currently satisfies the mobile contract.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Floot adapter: incomplete (non-blocking)' >> "$GITHUB_STEP_SUMMARY"
            echo 'GitHub/Docker is the canonical backend control plane; Floot remains an optional adapter and does not block this PR.' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'See the floot-adapter-report artifact for the missing routes.' >> "$GITHUB_STEP_SUMMARY"
            cat floot-cutover-report.json || true
          fi
