name: Repair Render Postgres Wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wire-render-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: philthysports-render-postgres-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_POSTGRES_ID: dpg-davo6kjncjis73f4r9og-a
      RENDER_SERVICE_ID: srv-davnqtou01pc73fg2iq0
      PROD_BASE_URL: https://philthysports-api-v9.onrender.com
    steps:
      - name: Require Render API credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not configured in repository Actions secrets"
            exit 2
          fi

      - name: Attach existing Render Postgres and deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ["RENDER_API_KEY"]
          postgres_id = os.environ["RENDER_POSTGRES_ID"]
          service_id = os.environ["RENDER_SERVICE_ID"]

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "PhilthySports-production-repair/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:500]
                  raise RuntimeError(f"Render API {method} failed with HTTP {exc.code}: {detail}") from exc

          _, connection = request(
              "GET",
              f"https://api.render.com/v1/postgres/{postgres_id}/connection-info",
          )
          database_url = str(connection.get("internalConnectionString") or "").strip()
          password = str(connection.get("password") or "").strip()
          if not database_url:
              raise RuntimeError("Render did not return an internal Postgres connection string")

          # Mask sensitive values before any later command can emit them.
          print(f"::add-mask::{database_url}")
          if password:
              print(f"::add-mask::{password}")

          for key in ("DATABASE_URL", "PHILTHY_EVIDENCE_DATABASE_URL"):
              status, _ = request(
                  "PUT",
                  f"https://api.render.com/v1/services/{service_id}/env-vars/{key}",
                  {"value": database_url},
              )
              if status not in (200, 201):
                  raise RuntimeError(f"Unexpected Render response while setting {key}: HTTP {status}")

          status, deploy = request(
              "POST",
              f"https://api.render.com/v1/services/{service_id}/deploys",
              {"clearCache": "do_not_clear", "deployMode": "build_and_deploy"},
          )
          if status not in (200, 201):
              raise RuntimeError(f"Render deploy trigger returned HTTP {status}")
          deploy_id = str(deploy.get("id") or "")
          if deploy_id:
              print(f"deploy_id={deploy_id}")
          print("Render Postgres wiring updated; deployment requested")
          PY

      - name: Verify durable production recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["PROD_BASE_URL"].rstrip("/")
          deadline = time.time() + 360
          last = None

          def get_json(path):
              req = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "PhilthySports-production-repair/1.0"},
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.status, json.loads(response.read().decode("utf-8"))

          while time.time() < deadline:
              try:
                  health_status, health = get_json("/health")
                  system_status, system = get_json("/v1/system/status")
                  evidence_status, evidence = get_json("/v1/evidence/signals?limit=1")
                  storage = evidence.get("storage_status") or {}
                  durable = evidence.get("durable_storage") is True and storage.get("durable") is True
                  postgres = storage.get("mode") == "render_postgres"
                  configured = storage.get("database_configured") is True
                  last = {
                      "health_status": health_status,
                      "system_status": system_status,
                      "evidence_status": evidence_status,
                      "durable": durable,
                      "postgres": postgres,
                      "configured": configured,
                      "database_error_type": storage.get("database_error_type"),
                  }
                  if health_status == system_status == evidence_status == 200 and durable and postgres and configured:
                      print(json.dumps(last, indent=2, sort_keys=True))
                      print("PhilthySports durable production storage verified")
                      raise SystemExit(0)
              except (urllib.error.URLError, TimeoutError, ValueError, json.JSONDecodeError) as exc:
                  last = {"probe_error": type(exc).__name__}
              time.sleep(8)

          print(json.dumps(last or {"probe_error": "no successful probe"}, indent=2, sort_keys=True))
          raise SystemExit("Production did not reach durable Render Postgres state before verification deadline")
          PY
