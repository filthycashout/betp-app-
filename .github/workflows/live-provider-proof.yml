name: PhilthySports Live Provider Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-provider-proof.yml'
      - 'backend/provider_canary.py'
      - 'backend/app.py'
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: philthysports-live-provider-proof
  cancel-in-progress: true

env:
  PHILTHY_PRODUCTION_BACKEND_URL: https://philthyparleys.floot.app/_api

jobs:
  live-provider-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Floot redacted provider canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider-proof
          base="${PHILTHY_PRODUCTION_BACKEND_URL%/}"
          ready=''
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$base/health" -o provider-proof/health.json \
              && curl -fsS --max-time 30 "$base/v1/providers/canary" -o provider-proof/provider-canary.json; then
              ready='yes'
              break
            fi
            sleep 5
          done
          printf '%s\n' "$base" > provider-proof/base-url.txt
          if [ -z "$ready" ]; then
            printf '%s\n' '{"status":"BLOCKED","reason":"Floot provider canary endpoint did not become reachable"}' > provider-proof/report.json
          fi

      - name: Evaluate direct live credential proof
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('provider-proof')
          report_path = root / 'report.json'
          if report_path.exists():
              print(report_path.read_text())
              raise SystemExit(0)

          def unwrap(payload):
              if isinstance(payload, dict) and 'json' in payload and set(payload).issubset({'json','meta'}):
                  return payload['json']
              return payload

          canary = unwrap(json.loads((root / 'provider-canary.json').read_text()))
          health = unwrap(json.loads((root / 'health.json').read_text()))
          odds = canary.get('theOddsApi') or canary.get('the_odds_api') or {}
          verified = canary.get('credentialledLiveProviderVerified')
          if verified is None:
              verified = canary.get('credentialled_live_provider_verified')

          configured = odds.get('configured')
          if configured is None:
              configured = odds.get('credential_configured')
          authenticated = odds.get('authenticated') is True
          schema_valid = odds.get('schemaValid')
          if schema_valid is None:
              schema_valid = odds.get('schema_valid')
          schema_valid = schema_valid is True

          passed = verified is True and configured is True and authenticated and schema_valid
          proof = {
              'schema_version': 4,
              'base_url': (root / 'base-url.txt').read_text().strip(),
              'host': health.get('host'),
              'service': health.get('service'),
              'workflow_head_sha': os.environ.get('GITHUB_SHA'),
              'provider': 'The Odds API v4',
              'credential_configured': configured is True,
              'rotation_confirmed': False,
              'authenticated': authenticated,
              'schema_valid': schema_valid,
              'http_status': odds.get('httpStatus', odds.get('http_status')),
              'catalog_count': odds.get('catalogCount', odds.get('catalog_count')),
              'requests_remaining': odds.get('requestsRemaining', odds.get('requests_remaining')),
              'secret_exposed': False,
              'provider_revocation_independently_verified': False,
              'status': 'PASS' if passed else 'BLOCKED',
              'reason': (
                  'Floot credentialed provider authenticated directly and returned the expected catalog schema'
                  if passed else
                  odds.get('reason') or 'direct credential canary did not pass'
              ),
          }
          report_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Upload provider proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-proof
          path: provider-proof/
          retention-days: 90
