name: PhilthySports Live Provider Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-provider-proof.yml'
      - 'backend/provider_canary.py'
      - 'backend/app.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployed redacted provider canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider-proof
          bases=(
            'https://philthysports-api-v9.onrender.com'
            'https://philthysports-powerhouse-v8.onrender.com'
          )
          selected=''
          for attempt in $(seq 1 40); do
            for base in "${bases[@]}"; do
              if curl -fsS --max-time 20 "$base/health" -o provider-proof/health.json \
                && curl -fsS --max-time 30 "$base/v1/providers/canary" -o provider-proof/provider-canary.json; then
                selected="$base"
                break 2
              fi
            done
            sleep 5
          done
          if [ -z "$selected" ]; then
            printf '%s\n' '{"status":"BLOCKED","reason":"deployed provider canary endpoint did not become reachable"}' > provider-proof/report.json
            exit 0
          fi
          printf '%s\n' "$selected" > provider-proof/base-url.txt
          curl -fsS --max-time 30 "$selected/v1/system/status" -o provider-proof/system-status.json
          curl -fsS --max-time 30 "$selected/v1/system/props" -o provider-proof/props-capabilities.json

      - name: Evaluate direct live credential proof
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('provider-proof')
          report_path = root / 'report.json'
          if report_path.exists():
              print(report_path.read_text())
              raise SystemExit(0)

          canary = json.loads((root / 'provider-canary.json').read_text())
          status = json.loads((root / 'system-status.json').read_text())
          health = json.loads((root / 'health.json').read_text())
          odds = canary.get('the_odds_api') or {}
          cred = status.get('credential_gate') or {}
          passed = (
              canary.get('credentialled_live_provider_verified') is True
              and odds.get('authenticated') is True
              and odds.get('schema_valid') is True
          )
          proof = {
              'schema_version': 3,
              'base_url': (root / 'base-url.txt').read_text().strip(),
              'deployment_commit': health.get('deployment_commit'),
              'workflow_head_sha': __import__('os').environ.get('GITHUB_SHA'),
              'provider': 'The Odds API v4',
              'credential_configured': odds.get('credential_configured') is True,
              'rotation_confirmed': odds.get('rotation_confirmed') is True,
              'authenticated': odds.get('authenticated') is True,
              'schema_valid': odds.get('schema_valid') is True,
              'http_status': odds.get('http_status'),
              'usage': odds.get('usage') or {},
              'secret_exposed': False,
              'provider_revocation_independently_verified': cred.get('provider_revocation_independently_verified') is True,
              'status': 'PASS' if passed else 'BLOCKED',
              'reason': (
                  'credentialed provider authenticated directly and returned the expected live catalog schema'
                  if passed else
                  odds.get('reason') or 'direct credential canary did not pass'
              ),
          }
          report_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Upload provider proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-provider-proof
          path: provider-proof/
          retention-days: 90
