name: PhilthySports v8 Evidence Capture

on:
  push:
    branches: [main]
    paths:
      - "backend/app.py"
      - "backend/free_odds_gateway.py"
      - "backend/evidence/**"
      - "backend/training/**"
      - ".github/workflows/v8-evidence-capture.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philthysports-v8-evidence-capture
  cancel-in-progress: false

env:
  PHILTHY_CANONICAL_PRODUCTION_BACKEND_URL: https://philthyparleys.floot.app/_api

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PHILTHY_EVIDENCE_BACKEND_URL: ${{ vars.PHILTHY_EVIDENCE_BACKEND_URL }}
      PHILTHY_PRODUCTION_BACKEND_URL: ${{ vars.PHILTHY_PRODUCTION_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-contract dependency
        run: python -m pip install "pydantic>=2.9,<3"

      - name: Resolve and verify evidence backend
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_URL="${PHILTHY_EVIDENCE_BACKEND_URL:-${PHILTHY_PRODUCTION_BACKEND_URL:-${PHILTHY_CANONICAL_PRODUCTION_BACKEND_URL:-}}}"
          if [ -z "$BACKEND_URL" ]; then
            echo "No evidence backend could be resolved." >&2
            exit 2
          fi
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "Evidence backend must be an HTTPS URL: $BACKEND_URL" >&2; exit 2 ;;
          esac
          BACKEND_URL="${BACKEND_URL%/}"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"

          python - <<'PY'
          import json, os, sys, urllib.request

          def unwrap(payload):
              if isinstance(payload, dict) and "json" in payload and set(payload).issubset({"json", "meta"}):
                  return payload["json"]
              return payload

          base = (
              os.environ.get("PHILTHY_EVIDENCE_BACKEND_URL")
              or os.environ.get("PHILTHY_PRODUCTION_BACKEND_URL")
              or os.environ.get("PHILTHY_CANONICAL_PRODUCTION_BACKEND_URL")
          ).rstrip("/")
          failures = []
          for path in ("/health", "/v1/system/status"):
              url = base + path
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      body = response.read().decode("utf-8", "replace")
                      if response.status != 200:
                          failures.append(f"{path}:HTTP_{response.status}")
                          continue
                      try:
                          payload = unwrap(json.loads(body))
                      except Exception as exc:
                          failures.append(f"{path}:INVALID_JSON:{type(exc).__name__}")
                          continue
                      if not isinstance(payload, dict):
                          failures.append(f"{path}:INVALID_OBJECT")
                          continue
                      if path == "/health":
                          if payload.get("status") != "ok" or payload.get("service") != "philthysports-runtime":
                              failures.append(f"{path}:INCOMPATIBLE_SERVICE_IDENTITY")
                          continue
                      storage = payload.get("evidence_storage") or payload.get("storage") or payload.get("database") or {}
                      if not isinstance(storage, dict) or storage.get("durable") is not True:
                          failures.append(f"{path}:EVIDENCE_STORAGE_NON_DURABLE")
                          continue
                      if storage.get("database_configured", storage.get("configured", True)) is not True:
                          failures.append(f"{path}:EVIDENCE_DATABASE_NOT_CONFIGURED")
                      if storage.get("database_error_type"):
                          failures.append(f"{path}:EVIDENCE_DATABASE_ERROR:{storage['database_error_type']}")
              except Exception as exc:
                  failures.append(f"{path}:{type(exc).__name__}:{exc}")
          if failures:
              print("Production backend verification failed:", *failures, sep="\n- ", file=sys.stderr)
              sys.exit(3)
          PY

      - name: Preserve evidence tools from main
        run: |
          cp backend/training/evidence_pipeline.py /tmp/evidence_pipeline.py
          cp backend/training/prediction_ledger.py /tmp/prediction_ledger.py
          cp backend/training/historical_backfill.py /tmp/historical_backfill.py
          cp backend/training/data_contract.py /tmp/data_contract.py
          cp backend/training/enrich_capture_contract.py /tmp/enrich_capture_contract.py
          cp backend/training/settlement_proof.py /tmp/settlement_proof.py
          cp backend/training/evidence_admission.py /tmp/evidence_admission.py

      - name: Capture strict pregame evidence from configured backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pregame_capture
          mkdir -p /tmp/pregame_capture
          python - "$BACKEND_URL" /tmp/pregame_capture <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("evidence_pipeline", "/tmp/evidence_pipeline.py")
          if spec is None or spec.loader is None:
              raise SystemExit("Could not load evidence pipeline")
          pipeline = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pipeline)
          upstream_json = pipeline._json

          def transport_json(url: str, timeout: int = 45):
              payload = upstream_json(url, timeout)
              if isinstance(payload, dict) and "json" in payload and set(payload).issubset({"json", "meta"}):
                  return payload["json"]
              return payload

          pipeline._json = transport_json
          pipeline.capture(sys.argv[1], Path(sys.argv[2]), 4)
          PY

      - name: Bind capture to evidence contract v2
        run: PYTHONPATH=/tmp python /tmp/enrich_capture_contract.py --capture-dir /tmp/pregame_capture

      - name: Validate captured pregame schema contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contract_reports
          shopt -s nullglob
          files=(/tmp/pregame_capture/pregame_*.jsonl)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one pregame JSONL capture, found ${#files[@]}" >&2
            exit 2
          fi
          PYTHONPATH=/tmp python /tmp/data_contract.py \
            --mode pregame \
            --input "${files[0]}" \
            --report /tmp/contract_reports/pregame.json

      - name: Switch to durable evidence branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin evidence-snapshots >/dev/null 2>&1; then
            git fetch origin evidence-snapshots:evidence-snapshots
            git switch evidence-snapshots
          else
            git switch -c evidence-snapshots
          fi

      - name: Store, settle, prove, rebuild, and admit evidence
        shell: bash
        run: |
          set -euo pipefail
          TARGET="evidence/pregame/$(date -u +%Y/%m/%d)"
          mkdir -p "$TARGET"
          cp /tmp/pregame_capture/* "$TARGET"/

          PYTHONPATH=/tmp python /tmp/prediction_ledger.py capture --root evidence --capture-dir "$TARGET"
          PYTHONPATH=/tmp python /tmp/evidence_pipeline.py settle --root evidence --lookback-days 21
          PYTHONPATH=/tmp python /tmp/prediction_ledger.py settle --root evidence --lookback-days 21
          PYTHONPATH=/tmp python /tmp/settlement_proof.py --root evidence --lookback-days 21
          PYTHONPATH=/tmp python /tmp/evidence_pipeline.py build --root evidence
          PYTHONPATH=/tmp python /tmp/historical_backfill.py merge --root evidence
          PYTHONPATH=/tmp python /tmp/prediction_ledger.py verify --root evidence

          mkdir -p evidence/run_metadata/contracts
          cp /tmp/contract_reports/pregame.json evidence/run_metadata/contracts/latest_pregame.json
          for SPORT in NFL NBA MLB NHL; do
            lower="$(echo "$SPORT" | tr '[:upper:]' '[:lower:]')"
            path="evidence/canonical/${lower}.csv"
            test -f "$path" || { echo "Missing canonical dataset: $path" >&2; exit 2; }
            PYTHONPATH=/tmp python /tmp/data_contract.py \
              --mode canonical \
              --sport "$SPORT" \
              --input "$path" \
              --features "consensus_de_vig_home_probability,home_spread,consensus_total" \
              --report "evidence/run_metadata/contracts/${lower}.json"
          done

          PYTHONPATH=/tmp python /tmp/evidence_admission.py \
            --root evidence \
            --report evidence/run_metadata/admission_latest.json

          cat > evidence/run_metadata/latest.json <<EOF
          {
            "captured_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_backend": "${BACKEND_URL}",
            "workflow_source_commit": "${GITHUB_SHA}",
            "branch": "evidence-snapshots",
            "historical_backfill_merge": true,
            "data_contract_version": "2",
            "data_contract_passed": true,
            "evidence_admission_version": "2",
            "evidence_admission_passed": true,
            "official_settlement_proof_sidecar": true,
            "free_odds_gateway_snapshot_provenance": true,
            "automatic_wagering": false,
            "secrets_embedded": false
          }
          EOF

      - name: Commit immutable evidence history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "philthysports-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Capture v8 admitted pregame evidence $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin evidence-snapshots
