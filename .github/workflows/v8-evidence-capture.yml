name: PhilthySports v8 Evidence Capture

on:
  push:
    branches: [main]
    paths:
      - "backend/app.py"
      - "backend/free_odds_gateway.py"
      - "backend/evidence/market_snapshot_store.py"
      - "backend/training/free_odds_evidence.py"
      - "backend/training/evidence_pipeline.py"
      - "backend/training/prediction_ledger.py"
      - "backend/training/historical_backfill.py"
      - ".github/workflows/v8-evidence-capture.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philthysports-v8-evidence-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PHILTHY_EVIDENCE_BACKEND_URL: ${{ vars.PHILTHY_EVIDENCE_BACKEND_URL }}
      PHILTHY_PRODUCTION_BACKEND_URL: ${{ vars.PHILTHY_PRODUCTION_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve evidence backend fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_URL="${PHILTHY_EVIDENCE_BACKEND_URL:-${PHILTHY_PRODUCTION_BACKEND_URL:-}}"
          if [ -z "$BACKEND_URL" ]; then
            echo "Set repository variable PHILTHY_EVIDENCE_BACKEND_URL or PHILTHY_PRODUCTION_BACKEND_URL." >&2
            exit 2
          fi
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "Evidence backend must be an HTTPS URL." >&2; exit 2 ;;
          esac
          echo "BACKEND_URL=${BACKEND_URL%/}" >> "$GITHUB_ENV"

      - name: Preserve evidence tools from main
        run: |
          cp backend/training/evidence_pipeline.py /tmp/evidence_pipeline.py
          cp backend/training/prediction_ledger.py /tmp/prediction_ledger.py
          cp backend/training/historical_backfill.py /tmp/historical_backfill.py

      - name: Capture strict pregame evidence from configured backend
        run: |
          set -euo pipefail
          rm -rf /tmp/pregame_capture
          mkdir -p /tmp/pregame_capture
          python /tmp/evidence_pipeline.py capture \
            --base-url "$BACKEND_URL" \
            --days 4 \
            --output-dir /tmp/pregame_capture

      - name: Switch to durable evidence branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin evidence-snapshots >/dev/null 2>&1; then
            git fetch origin evidence-snapshots:evidence-snapshots
            git switch evidence-snapshots
          else
            git switch -c evidence-snapshots
          fi

      - name: Store capture, settle results, and rebuild canonical rows
        shell: bash
        run: |
          set -euo pipefail
          TARGET="evidence/pregame/$(date -u +%Y/%m/%d)"
          mkdir -p "$TARGET"
          cp /tmp/pregame_capture/* "$TARGET"/

          PYTHONPATH=/tmp python /tmp/prediction_ledger.py capture \
            --root evidence \
            --capture-dir "$TARGET"

          python /tmp/evidence_pipeline.py settle \
            --root evidence \
            --lookback-days 21

          PYTHONPATH=/tmp python /tmp/prediction_ledger.py settle \
            --root evidence \
            --lookback-days 21

          python /tmp/evidence_pipeline.py build \
            --root evidence

          python /tmp/historical_backfill.py merge \
            --root evidence

          PYTHONPATH=/tmp python /tmp/prediction_ledger.py verify \
            --root evidence

          mkdir -p evidence/run_metadata
          cat > evidence/run_metadata/latest.json <<EOF
          {
            "captured_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_backend": "${BACKEND_URL}",
            "workflow_source_commit": "${GITHUB_SHA}",
            "branch": "evidence-snapshots",
            "historical_backfill_merge": true,
            "free_odds_gateway_snapshot_provenance": true,
            "secrets_embedded": false
          }
          EOF

      - name: Commit immutable evidence history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "philthysports-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add evidence
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Capture v8 pregame evidence $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin evidence-snapshots
