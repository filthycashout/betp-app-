name: PhilthySports Historical Access Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-access-probe.yml'
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PHILTHY_PRODUCTION_BACKEND_URL: https://philthyparleys.floot.app/_api

jobs:
  historical-access-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe historical-access capability through Floot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historical-access-proof
          curl -fsS --max-time 30 \
            "${PHILTHY_PRODUCTION_BACKEND_URL%/}/v1/providers/canary?historical_probe=true" \
            -o historical-access-proof/canary.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('historical-access-proof/canary.json').read_text())
          src = raw.get('json') if isinstance(raw, dict) and 'json' in raw and set(raw).issubset({'json','meta'}) else raw
          odds = src.get('theOddsApi') or src.get('the_odds_api') or {}
          hist = odds.get('historicalAccessProbe') or odds.get('historical_access_probe') or {}
          status = hist.get('status') or 'UNAVAILABLE'
          report = {
              'schema_version': 2,
              'source_backend': 'https://philthyparleys.floot.app/_api',
              'provider': 'The Odds API v4',
              'live_authenticated': odds.get('authenticated') is True,
              'historical_access_status': status,
              'historical_http_status': hist.get('httpStatus', hist.get('http_status')),
              'historical_schema_valid': (hist.get('schemaValid', hist.get('schema_valid')) is True),
              'historical_events_returned': hist.get('eventsReturned', hist.get('events_returned')),
              'historical_probe_date': hist.get('probeDate', hist.get('probe_date')),
              'usage': hist.get('usage') or {},
              'secret_exposed': False,
              'safe_for_bulk_backfill': False,
              'reason': hist.get('reason') or 'Floot runtime does not currently expose a verified historical-access probe',
          }
          # Bulk historical backfill stays blocked until the runtime returns an
          # explicit verified historical-access result plus an independent
          # budget/quota gate. Live authentication alone is not sufficient.
          Path('historical-access-proof/report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-access-proof
          path: historical-access-proof/
          retention-days: 90
