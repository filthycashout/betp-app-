name: Apply PhilthySports FreeOddsGateway

on:
  push:
    branches: [main]
    paths:
      - 'backend/free_odds_gateway.py'
      - 'backend/evidence/market_snapshot_store.py'
      - 'backend/outcome_validation.py'
      - 'backend/training/free_odds_evidence.py'
      - 'backend/tests/test_free_odds_gateway.py'
      - 'scripts/apply_free_odds_gateway.py'
      - '.github/workflows/apply-free-odds-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-philthysports-free-odds-gateway
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic gateway patch
        run: python scripts/apply_free_odds_gateway.py

      - name: Validate patched syntax
        run: |
          python -m py_compile \
            backend/app.py \
            backend/free_odds_gateway.py \
            backend/outcome_validation.py \
            backend/evidence/market_snapshot_store.py \
            backend/training/free_odds_evidence.py \
            scripts/apply_free_odds_gateway.py

      - name: Install validation dependencies
        run: python -m pip install -q -r backend/requirements.txt -r backend/requirements-validation.txt

      - name: Run focused regression tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_free_odds_gateway.py \
            backend/tests/test_validation.py \
            backend/tests/test_app.py

      - name: Commit verified gateway
        run: |
          git add \
            backend/app.py \
            backend/requirements.txt \
            backend/Dockerfile
          if git diff --cached --quiet; then
            echo 'Gateway patch already applied.'
            exit 0
          fi
          git config user.name 'philthysports-gateway-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Integrate PhilthySports FreeOddsGateway'
          git pull --rebase origin main
          git push origin main
