name: Apply Runtime Reliability Fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_mobile_performance_fix.py
      - .github/workflows/apply-runtime-reliability-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply cache-first performance fix
        run: python scripts/apply_mobile_performance_fix.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-validation.txt

      - name: Verify backend source and regression suite
        run: |
          python -m py_compile backend/app.py backend/evidence/runtime.py backend/odds_api_net.py scripts/apply_mobile_performance_fix.py
          PYTHONPATH=backend pytest -q backend/tests
          (cd backend && python odds_api_net_smoke.py)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile_dashboard/package-lock.json

      - name: Verify dashboard
        working-directory: mobile_dashboard
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Commit verified performance release
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/app.py \
            mobile_dashboard/app/sports-dashboard.tsx \
            mobile_dashboard/lib/fast-cache.ts \
            mobile_dashboard/tests/fast-cache.test.ts \
            mobile_dashboard/package.json \
            mobile_dashboard/package-lock.json \
            assets/dashboard \
            pubspec.yaml
          if git diff --cached --quiet; then
            echo 'No performance changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make picks and parlays cache-first (1.6.7)'
          git push origin HEAD:main
