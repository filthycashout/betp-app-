[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sports-omni-project"
version = "0.1.0"
description = "Evidence-first sports-market validation utilities"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["01_Core_Engine"]
testpaths = ["tests"]
addopts = "-ra"
